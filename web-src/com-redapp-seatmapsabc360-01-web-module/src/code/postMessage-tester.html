<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SeatMap postMessage Tester</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; background: #f5f5f5; }
    button { margin: 0.5rem; padding: 0.6rem 1rem; font-size: 1rem; cursor: pointer; }
    pre { background: #eee; padding: 1rem; border-radius: 5px; white-space: pre-wrap; }
    iframe { border: 1px solid #ccc; width: 100%; height: 800px; margin-top: 2rem; }
  </style>
</head>
<body>

  <h1>🧪 SeatMap postMessage Tester</h1>

  <button onclick="sendConfig()">Send CONFIG</button>
  <button onclick="sendFlight()">Send FLIGHT</button>
  <button onclick="sendAvailability()">Send AVAILABILITY</button>
  <button onclick="sendPassengers()">Send PASSENGERS</button>

  <h2>📦 Последнее отправленное сообщение:</h2>
  <pre id="lastSent">{ пусто }</pre>

  <iframe id="seatmapFrame" src="https://quicket.io/react-proxy-app/" title="SeatMap IFrame"></iframe>

  <script>
    const iframe = document.getElementById("seatmapFrame");

    const send = (type, data) => {
      const payload = { type, data };
      iframe.contentWindow.postMessage(payload, "*");
      document.getElementById("lastSent").textContent = JSON.stringify(payload, null, 2);
    };

    const sendConfig = () => {
      send("config", {
        width: 400,
        lang: "EN",
        builtInTooltip: true,
        visibleFuselage: true
      });
    };

    const sendFlight = () => {
      send("flight", {
        id: "111",
        airlineCode: "EK",
        flightNo: "50",
        departureDate: "2025-03-21",
        departure: "MUC",
        arrival: "DXB",
        cabinClass: "Y"
      });
    };

    const sendAvailability = () => {
      send("availability", {
        decks: [
          {
            deckIndex: 0,
            cabins: [],
            seats: [
              { seatNumber: "1A", status: "AVAILABLE" },
              { seatNumber: "1B", status: "OCCUPIED" },
              { seatNumber: "1C", status: "BLOCKED" },
              { seatNumber: "2A", status: "AVAILABLE" },
              { seatNumber: "2B", status: "AVAILABLE" },
              { seatNumber: "2C", status: "OCCUPIED" }
            ]
          }
        ]
      });
    };

    const sendPassengers = () => {
      send("passengers", [
        { id: "PAX1", name: "John Doe" }
      ]);
    };
  </script>
</body>
</html>
